name: Signlight private E2E

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  signlight:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is safe here because only the trusted default branch
      # is checked out; the pull request's code is never fetched or executed.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
